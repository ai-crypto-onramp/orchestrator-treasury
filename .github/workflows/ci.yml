name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ai-crypto-onramp/.github/.github/workflows/go-service-ci.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod download
      - run: make cover-check